:root{
  --bg:#000;--panel:#0C0C0D;--field:#161617;--ink:#F4F3EF;--muted:#B9B7B0;--faint:#8A8882;
  --line:rgba(255,255,255,.16);--line-hi:rgba(255,255,255,.4);
  --red:#E5202B;--open:#F0BE5E;--paid:#7DD6A4;--todo:#A9B0BF;--quote:#B9A6E8;--danger:#FF5A52;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --f:"Albert Sans",-apple-system,system-ui,sans-serif;--logo:"Fredoka","Albert Sans",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.35;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wm{font-family:var(--logo);font-weight:700;text-transform:lowercase;letter-spacing:-.01em;line-height:1;color:#fff}
.wm i{font-style:normal;color:var(--red)}
.mic{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#A9A7A0;font-weight:600}
.muted{color:var(--muted);font-size:14px}

/* top + bottom bars */
.top{flex:none;padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);min-height:calc(var(--st) + 54px)}
.top .wm{font-size:22px}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.back{display:flex;align-items:center;gap:4px;font-size:16px;color:var(--ink);padding:8px 8px 8px 0;margin:-8px 0}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--paid);flex:none}
.sdot.busy{background:var(--open)}.sdot.offline{background:var(--faint)}.sdot.err{background:var(--danger)}
.tbtn{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:10px 14px;border:1px solid var(--line-hi)}
.tbtn.w{background:#fff;color:#000;border-color:#fff}
#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-bottom:var(--sb);background:#000}
.tabs button{padding:11px 0 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=true]{color:#fff}
.tabs button[aria-current=true]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--red)}
.tabs .cnt{position:absolute;top:6px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;letter-spacing:0;border-radius:9px;min-width:17px;padding:1px 5px}

/* fields */
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--field);border:0;border-bottom:1px solid var(--line-hi);border-radius:0;padding:12px;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
input:focus,select:focus,textarea:focus{border-bottom-color:#fff;background:#1c1c1e}
input::placeholder,textarea::placeholder{color:#77756f}
textarea{min-height:104px;resize:none;line-height:1.45;display:block}
select{background-image:linear-gradient(45deg,transparent 50%,#bbb 50%),linear-gradient(135deg,#bbb 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date]{text-align:left}
.field{display:block;min-width:0}
.field>.mic{display:block;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stack{display:grid;gap:12px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);padding:16px;margin:0 0 14px}
.card>h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0 0 14px;padding-left:10px;border-left:3px solid var(--red);display:flex;align-items:center;gap:10px}
.card>h2 .r{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border:1px solid var(--line-hi);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.btn.w{background:#fff;color:#000;border-color:#fff}
.btn.pay{background:var(--paid);color:#04160c;border-color:var(--paid)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger{color:var(--danger);border-color:rgba(255,90,82,.5)}
.btn.armed{background:var(--danger);color:#000;border-color:var(--danger)}
.btn.full{width:100%}
.btn:active{opacity:.7}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}.row-btns>*{flex:1}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border:1px solid var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);white-space:nowrap}
.chip b{font-weight:600;color:var(--faint);margin-left:6px}
.chip[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}.chip[aria-pressed=true] b{color:#555}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-hi)}
.seg button{padding:12px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:#fff;color:#000}
.seg.st button[aria-pressed=true].todo{background:var(--todo)}.seg.st button[aria-pressed=true].open{background:var(--open)}
.seg.st button[aria-pressed=true].paid{background:var(--paid)}.seg.st button[aria-pressed=true].quote{background:var(--quote)}

/* job list */
.jc{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--line-hi));padding:14px 14px 13px;margin-bottom:10px}
.jc .t{font-size:17px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.jc .t span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc .t .num{font-weight:600;white-space:nowrap}
.jc .s{color:var(--muted);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc .b{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--c,var(--muted))}
.jc .b .x{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500;font-size:13.5px}
.live{color:var(--red)!important;font-weight:700}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:7px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

.strip{flex:none;border-top:1px solid var(--line-hi);padding:10px 16px calc(var(--sb) + 10px);display:flex;align-items:center;gap:10px;background:#000}
.strip .tt{flex:1;min-width:0}.strip .tt .num{font-size:22px;font-weight:600;display:block;line-height:1.1}
.strip .btn{padding:0 12px;min-height:48px}
.paidb{color:var(--paid);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.call{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border:1px solid var(--line-hi);color:var(--ink);text-decoration:none;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}

/* buy + notes */
.bi{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.bi:first-of-type{border-top:0}

.bi .m{flex:1;min-width:0}.bi .m .n{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bi .m .c{font-size:13px;color:var(--muted)}

#toast.show{transform:none;opacity:1}#toast.bad{background:var(--danger)}

<body>
<div id="app" style="display:contents"></div>
<div id="toast" role="status"></div>
<script>
(function(){
"use strict";
const HOST=false;
const DEFAULT_SETTINGS={
  shopName:'BBD Motorsports', legalName:'', regCode:'', vatCode:'', address:'Vilnius', phone:'', email:'', iban:'', bank:'',
  rate:'35', markup:'20', vat:'0',
  invPrefix:'BBD', invNext:1, ownerName:'Skirmantas', splash:true, payDays:'7', invLang:'lt', groupMaterials:true, invNote:'', woNext:1, woPrices:'total', woTerms:'', quoteNext:1, team:'', worker:'', taglineLt:'Sportinės išmetimo sistemos · Automobilių remontas', taglineEn:'Custom exhausts · Car repairs', lastType:'exhaust'
};
const STATUS={quote:'Quote',todo:'Waiting',open:'In progress',done:'Unpaid',paid:'Paid'};
const STATUS_LONG={quote:'Quote',todo:'Waiting to start',open:'In progress',done:'Done, not paid',paid:'Paid'};
const ORDER=['todo','open','done','paid'];
const finished=j=>j.status==='done'||j.status==='paid';
const eur=new Intl.NumberFormat('lt-LT',{style:'currency',currency:'EUR'});
const dec=new Intl.NumberFormat('lt-LT',{maximumFractionDigits:2});
const dec2=new Intl.NumberFormat('lt-LT',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((n||0)*100)/100;
const money=n=>eur.format(r2(n));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;if(v==null)return 0;const s=String(v).replace(/[\s €]/g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0;};
const hrs=v=>{const s=String(v==null?'':v).trim();const m=s.match(/^(\d+):(\d{1,2})$/);return m?(+m[1])+(+m[2])/60:num(s);};
const fmtH=h=>dec.format(r2(h))+' h';
const pad=(n,w)=>String(n).padStart(w||2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDate(new Date());
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const clock=ms=>{const t=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60);};
const ICON_X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ================= math ================= */
function calc(j){
  const rate=num(j.rate), markup=num(j.markup), vatPct=num(j.vat);
  const hours=(j.labor||[]).reduce((s,l)=>s+hrs(l.hours),0), est=hrs(j.estHours);
  // until the job is finished the price uses the estimate if it is higher than the hours logged so far
  const billH=(j.status==='done'||j.status==='paid')?(hours||est):Math.max(hours,est), isEst=billH!==hours;
  const labor=billH*rate;
  let partsSell=0,partsCost=0,matSell=0;const lines={};
  (j.items||[]).forEach(it=>{
    const q=num(it.qty), cost=num(it.cost);
    const auto=cost*(1+markup/100);
    const unit=(it.price!==''&&it.price!=null)?num(it.price):auto;
    const lc=q*cost, ls=q*unit; partsCost+=lc; partsSell+=ls; if(it.kind==='material')matSell+=ls;
    lines[it.id]={cost:lc,sell:ls,auto,unit};
  });
  const sub=labor+partsSell, discount=num(j.discount), net=Math.max(0,sub-discount);
  const vat=net*vatPct/100, total=net+vat, profit=net-partsCost;
  return {rate,markup,vatPct,hours,est,billH,isEst,labor,partsSell,partsCost,matSell,sub,discount,net,vat,total,profit,lines};
}

const stockKey=n=>String(n||'').trim().toLowerCase();
const stockBy=k=>k?Object.values(db.stock||{}).find(s=>stockKey(s.name)===k)||null:null;
const stockFind=name=>stockBy(stockKey(name));
const qStr=n=>String(r2(n)).replace('.',',');
const stockLow=s=>String(s.min==null?'':s.min).trim()!==''&&num(s.qty)<=num(s.min);
function syncItem(j,it,remove){
  const k=stockKey(it.name); let taken=num(it.stockTaken)||0;
  const off=remove||j.status==='quote';
  if(taken&&it.stockKey&&(it.stockKey!==k||off)){const old=stockBy(it.stockKey); if(old)old.qty=qStr(num(old.qty)+taken); taken=0;}
  if(!off&&(!finished(j)||it.stockKey===k)){
    const st=stockBy(k);
    if(st){const want=num(it.qty); st.qty=qStr(num(st.qty)-(want-taken)); taken=want; it.stockKey=k;} else taken=0;
  }
  if(taken)it.stockTaken=taken; else{delete it.stockTaken; if(off||!stockBy(k))delete it.stockKey;}
}
function syncStock(j,remove){(j.items||[]).forEach(it=>syncItem(j,it,remove));}
const team=()=>String(S().team||'').split(',').map(x=>x.trim()).filter(Boolean);
const worker=()=>{const t=team();return t.includes(S().worker)?S().worker:(t[0]||'');};
const TYPES={exhaust:'Exhaust',service:'Service',repair:'Repair',other:'Other'};


/* ================= storage ================= */
const LS_KEY='bbd-phone-db';
const store={
  async load(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}},
  async save(text){localStorage.setItem(LS_KEY,text);}
};
const blankDB=()=>({app:'bbd-garage',version:1,jobs:{},notes:{},buy:{},reminders:{},stock:{},templates:{},expenses:{},payouts:{},bookcfg:{},settings:clone(DEFAULT_SETTINGS),sync:null});
let db=blankDB();
const S=()=>db.settings;
let saveT=null;
function save(){
  db.savedAt=Date.now(); clearTimeout(saveT);
  saveT=setTimeout(()=>{store.save(JSON.stringify(db)).catch(()=>toast('Phone storage is full. Changes may not be kept.',true));},250);
  syncSoon(2000);
}
/* ================= sync (PC and phone share this) ================= */
const SB_URL=window.__SB_URL||'https://iozgsyngugdtaolmexwf.supabase.co';
const SB_KEY='sb_publishable_cQzB1fkXjGElNFurkijtHQ_h0kmgw5W';
const SYNC_KINDS=['jobs','notes','buy','reminders','stock','templates','expenses','payouts','bookcfg'];
const canon=v=>{
  if(v===null||v===undefined||typeof v!=='object')return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
};
const hashOf=o=>{
  const s=canon(o); let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+'.'+(h1>>>0).toString(36)+'.'+s.length.toString(36);
};
class SyncAuth extends Error{}
const sync={state:'off',msg:'',last:0,busy:false,queued:false,queuedFull:false,timer:null,fullAt:0,hooks:{applied(){},status(){}}};
const SY=()=>db.sync&&db.sync.rt?db.sync:null;
const syncOn=()=>!!SY();
function syncSet(state,msg){sync.state=state;sync.msg=msg||'';try{sync.hooks.status();}catch(e){}}
const syncPersist=()=>Promise.resolve(store.save(JSON.stringify(db))).catch(()=>{});

/* --- transport: the Windows program sends requests itself, a browser uses fetch --- */
const httpWait={}; let httpSeq=0;
window.__bbdHttpDone=(id,status,body)=>{const w=httpWait[id]; if(!w)return; delete httpWait[id]; clearTimeout(w.t); if(status>0)w.ok({status,text:body}); else w.no(new Error(body||'offline'));};
function sbHttp(method,path,body,token,extra){
  const headers=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{},extra||{});
  const text=body==null?'':JSON.stringify(body);
  if(HOST&&typeof window.bbdHttp==='function'){
    return new Promise((ok,no)=>{
      const id=String(++httpSeq);
      httpWait[id]={ok,no,t:setTimeout(()=>{delete httpWait[id];no(new Error('timeout'));},40000)};
      Promise.resolve(window.bbdHttp(id,method,SB_URL+path,JSON.stringify(headers),text)).catch(e=>{delete httpWait[id];no(e);});
    });
  }
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),30000);
  return fetch(SB_URL+path,{method,headers,body:body==null?undefined:text,cache:'no-store',signal:ctl.signal})
    .then(async r=>({status:r.status,text:await r.text()})).finally(()=>clearTimeout(t));
}
const sbErr=r=>{let m='';try{const d=JSON.parse(r.text);m=d.msg||d.message||d.error_description||d.error||'';}catch(e){}return m||('Server answered '+r.status);};

/* --- account --- */
async function syncSignIn(email,password){
  const r=await sbHttp('POST','/auth/v1/token?grant_type=password',{email,password});
  if(r.status!==200){const m=sbErr(r);throw new Error(/invalid/i.test(m)?'Wrong email or password':/confirm/i.test(m)?'This email is not confirmed yet':m);}
  const d=JSON.parse(r.text), old=db.sync;
  const same=old&&old.uid&&d.user&&old.uid===d.user.id;
  db.sync={email,uid:d.user?d.user.id:'',rt:d.refresh_token,at:d.access_token,exp:Date.now()+d.expires_in*1000,
    cursor:same?old.cursor||'':'',hash:same?old.hash||{}:{},ver:same?old.ver||{}:{}};
  await syncPersist(); syncSet('ok','Signed in'); return syncNow(true);
}
async function syncSignOut(){
  const s=SY(); if(s&&s.at){try{await sbHttp('POST','/auth/v1/logout?scope=local',{},s.at);}catch(e){}}
  db.sync=null; await syncPersist(); syncSet('off');
}
async function syncToken(){
  const s=SY(); if(!s)throw new SyncAuth('Not signed in');
  if(s.at&&s.exp-Date.now()>90000)return s.at;
  const r=await sbHttp('POST','/auth/v1/token?grant_type=refresh_token',{refresh_token:s.rt});
  if(r.status===200){const d=JSON.parse(r.text);s.at=d.access_token;s.rt=d.refresh_token;s.exp=Date.now()+d.expires_in*1000;await syncPersist();return s.at;}
  if(r.status===400||r.status===401||r.status===403)throw new SyncAuth('Sign in again');
  throw new Error(sbErr(r));
}

/* --- records --- */
function syncLocal(){
  const m={};
  SYNC_KINDS.forEach(k=>Object.values(db[k]||{}).forEach(r=>{if(r&&r.id&&!r.example)m[k+'/'+r.id]=r;}));
  m['settings/main']=db.settings; return m;
}
const keyParts=key=>{const i=key.indexOf('/');return [key.slice(0,i),key.slice(i+1)];};
async function sbGet(tok,query){
  const out=[]; const PAGE=500;
  for(let off=0;;off+=PAGE){
    const r=await sbHttp('GET','/rest/v1/bbd_records?'+query+'&limit='+PAGE+'&offset='+off,null,tok);
    if(r.status===401)throw new SyncAuth('Sign in again');
    if(r.status!==200)throw new Error(sbErr(r));
    const rows=JSON.parse(r.text); out.push(...rows); if(rows.length<PAGE)break;
  }
  return out;
}
function syncApply(rows){
  const s=SY(); let changed=false, top=s.cursor||'';
  rows.forEach(r=>{
    const key=r.kind+'/'+r.id, isSet=r.kind==='settings';
    if(!isSet&&!SYNC_KINDS.includes(r.kind))return;
    s.ver[key]=r.updated_at;
    if(!top||Date.parse(r.updated_at)>Date.parse(top))top=r.updated_at;
    const local=isSet?db.settings:(db[r.kind]||{})[r.id];
    const lh=local?hashOf(local):null, known=s.hash[key];
    const pending=known!==undefined&&lh!==known;      // changed or deleted here since the last sync
    if(r.deleted||r.data==null){
      if(isSet)return;
      if(local&&!pending){delete db[r.kind][r.id];changed=true;}
      if(!local||!pending)delete s.hash[key];
      return;
    }
    const rh=hashOf(r.data);
    if(lh===rh){s.hash[key]=rh;return;}
    if(pending)return;                                 // our newer edit goes up in the push below
    if(isSet)db.settings=Object.assign(clone(DEFAULT_SETTINGS),r.data);
    else{if(!db[r.kind])db[r.kind]={};db[r.kind][r.id]=r.data;}
    s.hash[key]=rh; changed=true;
  });
  s.cursor=top; return changed;
}
async function syncRun(full){
  const s=SY(); if(!s)return;
  const tok=await syncToken();
  let changed=false;
  /* pull */
  if(full||!s.cursor){
    const idx=await sbGet(tok,'select=kind,id,updated_at,deleted&order=kind.asc,id.asc');
    const want={}; let top=s.cursor||'';
    idx.forEach(r=>{
      const key=r.kind+'/'+r.id;
      if(s.ver[key]===r.updated_at){if(!top||Date.parse(r.updated_at)>Date.parse(top))top=r.updated_at;return;}
      (want[r.kind]=want[r.kind]||[]).push(r.id);
    });
    for(const kind of Object.keys(want)){
      for(let i=0;i<want[kind].length;i+=60){
        const ids=want[kind].slice(i,i+60).map(x=>'"'+String(x).replace(/["\\]/g,'')+'"').join(',');
        const rows=await sbGet(tok,'select=kind,id,data,deleted,updated_at&kind=eq.'+encodeURIComponent(kind)+'&id=in.('+encodeURIComponent(ids)+')&order=id.asc');
        if(syncApply(rows))changed=true;
      }
    }
    if(top&&(!s.cursor||Date.parse(top)>Date.parse(s.cursor)))s.cursor=top;
    sync.fullAt=Date.now();
  }else{
    const hr=await sbHttp('GET','/rest/v1/bbd_records?select=updated_at&order=updated_at.desc&limit=1',null,tok);
    if(hr.status===401)throw new SyncAuth('Sign in again');
    if(hr.status!==200)throw new Error(sbErr(hr));
    const head=JSON.parse(hr.text);
    if(head.length&&head[0].updated_at!==s.cursor){
      const rows=await sbGet(tok,'select=kind,id,data,deleted,updated_at&updated_at=gt.'+encodeURIComponent(s.cursor)+'&order=updated_at.asc,kind.asc,id.asc');
      if(syncApply(rows))changed=true;
      if(Date.parse(head[0].updated_at)>Date.parse(s.cursor))s.cursor=head[0].updated_at;
    }
  }
  /* push */
  const recs=syncLocal(), out=[], pend={};
  const stamp=new Date(Math.max(Date.now(),(s.cursor?Date.parse(s.cursor):0)+1)).toISOString();
  Object.keys(recs).forEach(key=>{
    const h=hashOf(recs[key]); if(s.hash[key]===h)return;
    const [kind,id]=keyParts(key); out.push({kind,id,data:recs[key],deleted:false,updated_at:stamp}); pend[key]=h;
  });
  Object.keys(s.hash).forEach(key=>{
    if(recs[key])return; const [kind,id]=keyParts(key);
    out.push({kind,id,data:null,deleted:true,updated_at:stamp}); pend[key]=null;
  });
  for(let i=0;i<out.length;i+=40){
    const part=out.slice(i,i+40);
    const r=await sbHttp('POST','/rest/v1/bbd_records?on_conflict=user_id,kind,id',part,tok,{Prefer:'resolution=merge-duplicates,return=minimal'});
    if(r.status===401)throw new SyncAuth('Sign in again');
    if(r.status<200||r.status>299)throw new Error(sbErr(r));
    part.forEach(p=>{const key=p.kind+'/'+p.id; if(pend[key]===null)delete s.hash[key]; else s.hash[key]=pend[key];});
  }
  if(changed||out.length)await syncPersist();
  if(changed){try{sync.hooks.applied();}catch(e){}}
  return {pulled:changed,pushed:out.length};
}
async function syncNow(full){
  if(!syncOn())return;
  if(sync.busy){sync.queued=true;sync.queuedFull=sync.queuedFull||!!full;return;}
  sync.busy=true; clearTimeout(sync.timer);
  if(sync.state!=='ok')syncSet('busy','Syncing…');
  try{
    await syncRun(full||Date.now()-sync.fullAt>10*60*1000);
    sync.last=Date.now(); syncSet('ok');
  }catch(e){
    if(e instanceof SyncAuth)syncSet('auth',e.message);
    else if(/fetch|network|offline|timeout|abort|load failed|dial|lookup|connect/i.test(String(e&&e.message||e)))syncSet('offline','No internet. Changes are kept and sent later.');
    else syncSet('error',String(e&&e.message||e));
  }finally{
    sync.busy=false;
    if(sync.queued){const f=sync.queuedFull;sync.queued=false;sync.queuedFull=false;syncSoon(300,f);}
  }
}
function syncSoon(ms,full){
  if(!syncOn())return;
  clearTimeout(sync.timer); sync.timer=setTimeout(()=>syncNow(full),ms==null?2000:ms);
}
function syncStart(){
  if(syncOn())syncNow(true); else syncSet('off');
  setInterval(()=>{if(syncOn()&&!document.hidden&&!sync.busy&&sync.state!=='auth')syncNow();},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSoon(200);});
  window.addEventListener('focus',()=>syncSoon(200));
  window.addEventListener('online',()=>syncSoon(200));
}

    case 'filter': ui.filter=b.dataset.f; return render();
    case 'open': ui.jobId=b.dataset.id; ui.listY=$('#view').scrollTop; render(); $('#view').scrollTop=0; return;
    case 'back': {const wasJob=!!ui.jobId; ui.jobId=null; ui.noteId=null; render(); if(wasJob&&ui.listY)$('#view').scrollTop=ui.listY; return;}
    case 'new-job': return newJob();
    case 'sync-now': syncNow(true).then(()=>{render(true); if(sync.state==='ok')toast('Synced');}); return;
    case 'logout': return arm(b,'Tap again to sign out',async()=>{await syncSignOut(); db=blankDB(); await store.save(JSON.stringify(db)); render();});
    case 'note-new': {const n={id:uid(),title:'',body:'',pinned:false,createdAt:Date.now(),updatedAt:Date.now()};db.notes[n.id]=n;ui.noteId=n.id;save();render();const t=$('.title-in');if(t)t.focus();return;}
    case 'note-open': ui.noteId=b.dataset.id; render(); $('#view').scrollTop=0; return;
    case 'note-pin': {const n=db.notes[ui.noteId]; if(!n)return; n.pinned=!n.pinned; save(); return render(true);}
    case 'note-del': {const n=db.notes[ui.noteId]; if(!n)return; return arm(b,'Tap again to delete',()=>{delete db.notes[n.id];ui.noteId=null;save();render();toast('Note deleted');});}
    case 'buy-done': {const it=db.buy[b.dataset.id]; if(!it)return; it.status='bought'; it.boughtDate=today(); if(!it.paid)it.paid=it.price||''; save(); render(true); return;}
    case 'buy-undo': {const it=db.buy[b.dataset.id]; if(!it)return; it.status='tobuy'; save(); return render(true);}
    case 'buy-urgent': {const it=db.buy[b.dataset.id]; if(!it)return; it.urgent=!it.urgent; save(); return render(true);}
    case 'buy-del': {const it=db.buy[b.dataset.id]; if(!it)return; return arm(b,'✕',()=>{delete db.buy[it.id]; save(); render(true);});}
    case 'buy-toggle': ui.showBought=!ui.showBought; return render(true);
  }
  if(!j)return;
  switch(act){
    case 'status': j.status=b.dataset.s; delete j.example;
      if(j.status==='paid'){if(!j.paidDate)j.paidDate=today(); if(b.dataset.pm)j.payMethod=b.dataset.pm;}
      syncStock(j); save(); render(true); if(j.status==='paid')toast('Marked as paid'+(j.payMethod?' ('+j.payMethod+')':'')); return;
    case 'pay-method': j.payMethod=j.payMethod===b.dataset.m?'':b.dataset.m; save(); return render(true);
    case 'job-type': j.type=b.dataset.t; S().lastType=j.type; save(); return render(true);
    case 'timer-start': {
      const other=Object.values(db.jobs).find(x=>x.timerStart&&x.id!==j.id);
      if(other){toast('Timer already running on “'+(other.title||'Untitled job')+'”. Stop it first.',true);return;}
      j.timerStart=Date.now(); if(j.status==='todo')j.status='open'; save(); return render(true);}
    case 'timer-stop': {
      if(!j.timerStart)return;
      const h=Math.max(0.01,r2((Date.now()-j.timerStart)/36e5));
      j.labor=(j.labor||[]).concat([{id:uid(),date:today(),hours:String(h).replace('.',','),note:'',who:worker()}]);
      j.timerStart=null; save(); render(true); toast('Logged '+fmtH(h)); return;}
    case 'add-labor': {const l={id:uid(),date:today(),hours:'',note:'',who:worker()}; j.labor=(j.labor||[]).concat([l]); save(); render(true); const i=$(`[data-f="labor.${l.id}.hours"]`); if(i)i.focus(); return;}
    case 'del-labor': return arm(b,'✕',()=>{j.labor=(j.labor||[]).filter(l=>l.id!==b.dataset.id); save(); render(true);});
    case 'add-item': {const it={id:uid(),kind:b.dataset.kind,name:'',qty:'1',unit:b.dataset.kind==='material'?'':'pcs',cost:'',price:''}; j.items=(j.items||[]).concat([it]); save(); render(true); const i=$(`[data-f="items.${it.id}.name"]`); if(i)i.focus(); return;}
    case 'del-item': return arm(b,'✕',()=>{const it=(j.items||[]).find(i=>i.id===b.dataset.id); if(it)syncItem(j,it,true); j.items=(j.items||[]).filter(i=>i.id!==b.dataset.id); save(); render(true);});
    case 'delete-job':
      if(j.invoiceNo){toast('This job has an invoice. Delete it on the garage computer.',true);return;}
      return arm(b,'Tap again to delete',()=>{syncStock(j,true); Object.values(db.reminders).forEach(r=>{if(r.jobId===j.id)delete db.reminders[r.id];}); delete db.jobs[j.id]; ui.jobId=null; save(); render(); toast('Job deleted');});
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value; $('#jw').innerHTML=jobsInner(); return;}
  if(t.dataset.n){const n=db.notes[ui.noteId]; if(!n)return; n[t.dataset.n]=t.value; n.updatedAt=Date.now(); return save();}
  if(!t.dataset.f)return; const j=cur(); if(!j)return;
  const p=t.dataset.f.split('.');
  if(p.length===1)j[p[0]]=t.value;
  else{const row=(j[p[0]]||[]).find(x=>x.id===p[1]); if(!row)return; row[p[2]]=t.value;}
  delete j.example; save(); updateTotals();
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.f)return; const j=cur(); if(!j)return;
  const p=t.dataset.f.split('.');
  if(p[0]==='items'&&(p[2]==='name'||p[2]==='qty')){const it=(j.items||[]).find(x=>x.id===p[1]); if(it){
    if(p[2]==='name'&&!num(it.cost)){const st=stockFind(it.name); if(st&&num(st.cost)){it.cost=String(st.cost); if(!it.unit&&st.unit)it.unit=st.unit;}}
    syncItem(j,it); save(); const ci=$(`[data-f="items.${it.id}.cost"]`), un=$(`[data-f="items.${it.id}.unit"]`); if(ci&&ci!==document.activeElement)ci.value=it.cost||''; if(un&&un!==document.activeElement)un.value=it.unit||''; updateTotals();}}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='buy-add')return; e.preventDefault();
  const name=$('#ba-name').value.trim(); if(!name){$('#ba-name').focus();return;}
  ui.buyCat=$('#ba-cat').value;
  const it={id:uid(),name,cat:ui.buyCat,price:$('#ba-price').value.trim(),shop:'',paid:'',status:'tobuy',urgent:false,createdAt:Date.now()};
  db.buy[it.id]=it; save(); render(true); toast('Added');
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='li-pass'||e.target.id==='li-email')){e.preventDefault();doLogin();}});
function doLogin(){
  const em=($('#li-email').value||'').trim(), pw=$('#li-pass').value||'', er=$('#li-err');
  if(!em||!pw){er.textContent='Type the email and the password.';return;}
  er.textContent='Signing in…';
  syncSignIn(em,pw).then(()=>{render();})
    .catch(err=>{const x=$('#li-err'); if(x)x.textContent=/fetch|network|offline|timeout|load failed/i.test(String(err.message))?'No internet connection.':err.message;});
}
setInterval(()=>{$$('[data-timer]').forEach(el=>{el.textContent=clock(Date.now()-Number(el.dataset.timer));});},1000);

/* ================= sync hooks + boot ================= */
let pendingRender=false;
sync.hooks.applied=()=>{if(typing()){pendingRender=true;return;} render(true);};
sync.hooks.status=()=>{paintDot(); if(sync.state==='auth'&&!typing())render(true);};
document.addEventListener('focusout',()=>{if(!pendingRender)return; setTimeout(()=>{if(typing())return; pendingRender=false; render(true);},250);});
(async function boot(){
  try{const d=await store.load(); if(d&&typeof d.jobs==='object'){db=Object.assign(blankDB(),d); db.settings=Object.assign(clone(DEFAULT_SETTINGS),d.settings||{});}}catch(e){}
  render(); syncStart();
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
})();
</script>
</body>
</html>
